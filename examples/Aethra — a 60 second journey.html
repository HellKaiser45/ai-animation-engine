<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>Aethra — a 60 second journey</title>
<style>

body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
canvas{width:min(100vw,calc((100vh - 70px)*16/9));aspect-ratio:16/9;display:block;background:#000}

</style></head><body>
<canvas id="c" width="512" height="288"></canvas>
<div id="bar"><button id="pp">Play ♪</button><input id="sl" type="range" min="0" max="6000" value="0"><span id="tl">0.0 / 60 s</span></div>
<script>
// ===== Aethra: Director (frame→state), World (procedural meshes), Renderer (software z-buffer rasterizer) =====

// ===== terrain: one heightfield mesh is the single source of truth (hm() reads the rendered triangles) =====
const G=120,S=480,CS=S/G,NV=G+1,HT=new Float32Array(NV*NV);

function hgt(x,z){

 const hx=(HT[j*NV+Math.min(i+1,G)]-HT[j*NV+Math.max(i-1,0)])/(2*CS),hz=(HT[Math.min(j+1,G)*NV+i]-HT[Math.max(j-1,0)*NV+i])/(2*CS),nl=Math.hypot(hx,1,hz);

for(let k=0;k<11;k++){const a=k/11*6.283+VR()*.3,r=9+VR()*8,x=26+Math.cos(a)*r,z=-40+Math.sin(a)*r;if(x<15&&Math.abs(z+40)<6)continue;

// ===== camera path: centripetal Catmull-Rom (Barry–Goldman), heights relative to the terrain mesh =====

const rel=a=>a.map(([x,o,z])=>[x,hm(x,z)+o,z]);
const CPK=rel([[-70,45,215],[-35,16,150],[-10,12,90],[2,9,35],[16,10,-12],[-12,11,-52],[-48,17,-92],[-22,26,-140],[14,16,-165]]);

// ===== lighting keyframes: [t, sun azimuth°, elevation°, horizon, zenith, sun, ambient] =====
const LK=[[0,100,8,[255,176,140],[86,120,190],[255,190,130],[90,100,140]],[20,110,32,[200,215,235],[70,130,210],[255,235,200],[110,130,170]],[40,250,14,[255,190,120],[90,110,170],[255,170,90],[100,100,130]],[60,270,4,[255,120,100],[40,40,110],[255,130,80],[70,70,130]]];
function lt(t){let i=0;while(i<LK.length-2&&t>LK[i+1][0])i++;const a=LK[i],b=LK[i+1],u=sm(a[0],b[0],t),m=(p,q)=>mix(p,q,u),az=lerp(a[1],b[1],u)*Math.PI/180,el=lerp(a[2],b[2],u)*Math.PI/180;

// ===== renderer =====

 if(mnx>mxx||mny>mxy)return;const ar=(x1-x0)*(y2-y0)-(x2-x0)*(y1-y0);if(ar>-1e-4&&ar<1e-4)return;const ia=1/ar;
 for(let y=mny;y<=mxy;y++){const py=y+.5;for(let x=mnx;x<=mxx;x++){const p=x+.5,w0=((x1-p)*(y2-py)-(x2-p)*(y1-py))*ia,w1=((x2-p)*(y0-py)-(x0-p)*(y2-py))*ia,w2=1-w0-w1;
  if(w0<0||w1<0||w2<0)continue;const z=w0*i0+w1*i1+w2*i2,i=y*W+x;if(z<=zb[i])continue;zb[i]=z;
  px[i]=0xFF000000|(((w0*a[5]+w1*b[5]+w2*c[5])&255)<<16)|(((w0*a[4]+w1*b[4]+w2*c[4])&255)<<8)|((w0*a[3]+w1*b[3]+w2*c[3])&255)}}}

function D(a,b,c,col,em){let ex=b[0]-a[0],ey=b[1]-a[1],ez=b[2]-a[2],gx=c[0]-a[0],gy=c[1]-a[1],gz=c[2]-a[2],nx=ey*gz-ez*gy,ny=ez*gx-ex*gz,nz=ex*gy-ey*gx;const l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;

const vis=(x,y,z,r)=>{const q=CV(x,y,z);return q[2]>-r&&q[2]<FAR&&Math.abs(q[0])<q[2]*.95+r+6};
const S0=[0,0,0,0,0,0],S1=[0,0,0,0,0,0],S2=[0,0,0,0,0,0],V=(s,k)=>{s[0]=VX[k*3];s[1]=VX[k*3+1];s[2]=VX[k*3+2];s[3]=VC[k*3];s[4]=VC[k*3+1];s[5]=VC[k*3+2]};

function frame(t){
