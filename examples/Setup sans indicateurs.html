<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Setup sans indicateurs</title>
<style>
:root{color-scheme:dark;--bg:#110C07;--ink:#FAF5E8;--mut:#8d9382;--pri:#A6D975;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Space Mono','Courier New',monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
svg{width:min(100vw,calc((100vh - 96px)*16/9));aspect-ratio:16/9;display:block;background:#110C07;overflow:hidden}
#bar{display:flex;gap:14px;align-items:center;width:min(94vw,900px);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
#bar input{flex:1;accent-color:var(--pri)}
button{font:700 12px 'Space Mono','Courier New',monospace;letter-spacing:.06em;text-transform:uppercase;background:#1C2915;color:var(--ink);border:2px solid var(--ink);border-radius:0;padding:8px 14px;cursor:pointer;box-shadow:4px 4px 0 #000}
button:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #000,0 0 14px rgba(166,217,117,.35);background:rgba(255,200,80,.15)}
button:active{transform:translate(4px,4px);box-shadow:0 0 0 #000}
#pp{background:var(--pri);color:#110C07}#pp:hover{background:#B4DD88}
button:disabled{opacity:.5;cursor:wait}
</style></head><body>

<script>
// ===== helpers =====
const NS='http://www.w3.org/2000/svg', DUR=34;
const $=(n,a={},p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const set=(e,k,v)=>{e._c=e._c||{};if(e._c[k]!==v){e._c[k]=v;e.setAttribute(k,v)}};

const ease=x=>x*x*(3-2*x), eo=x=>1-Math.pow(1-x,3);

const K=[[0,640,360,1],[14.6,650,360,1.02],[16.2,420,300,1.28],[28.6,420,300,1.3],[34,480,300,1.35]];

const SERIF="'Newsreader',Georgia,serif";

const R=rng(7),N=44,CX=50,CW=740,Y0=90,Y1=440,cs=[];

const ema=k=>{const a=2/(k+1);let e=cs[0].c;return cs.map(c=>e+=a*(c.c-e))};

 const a1=seg(t,9.7,11),a2=seg(t,11.1,12.4),a3=seg(t,12.5,14);

 set(rsiP,'stroke-dashoffset',(1-a1).toFixed(3));set(e9P,'stroke-dashoffset',(1-a2).toFixed(3));set(e21P,'stroke-dashoffset',(1-a2).toFixed(3));
 set(clipR,'width',(CW*a3).toFixed(1));set(bbP,'opacity',a3>0?1:0);
 [[tR,a1],[tE,a2],[tB,a3]].forEach(([g,a])=>{set(g.g,'opacity',clamp(a*3).toFixed(3));set(g.st,'x2',(-g.w/2-4+(g.w+8)*sk).toFixed(1))});
 set(badge,'opacity',(seg(t,15.9,16.6)*(1-seg(t,18.4,19))).toFixed(3));
 // AI report card
 set(card,'transform',`translate(${(830+450*eo(seg(t,14.2,15.2))).toFixed(1)} 74)`);set(card,'opacity',(seg(t,2.6,3.2)*(1-seg(t,15,15.2))).toFixed(3));
 rows.forEach((r,i)=>{const u=seg(t,ROW_T[i],ROW_T[i]+.5);set(r.g,'opacity',u.toFixed(3));set(r.g,'transform',`translate(${(24+24*(1-eo(u))).toFixed(1)} ${r.y})`);
  if(r.ck)set(r.ck,'stroke-dashoffset',(1-seg(t,ROW_T[i]+.2,ROW_T[i]+.7)).toFixed(3))});
 // backtests
 set(tg,'opacity',(ease(seg(t,18.9,19.5))*(1-.75*ease(seg(t,25.8,26.8)))*(1-ease(seg(t,28.6,29.4)))).toFixed(3));
 tiles.forEach((k,i)=>{set(k.a,'stroke-dashoffset',(1-seg(t,19.2+i*.11,20.1+i*.11)).toFixed(3));set(k.b,'stroke-dashoffset',(1-seg(t,22.2+i*.07,23.1+i*.07)).toFixed(3))});
 const s=eo(seg(t,25.8,26.3));set(stamp,'transform',`translate(420 285) rotate(-8) scale(${(1.6-.6*s).toFixed(3)})`);set(stamp,'opacity',(s*(1-seg(t,28.7,29.2))).toFixed(3));
 // finale: pulsing ring on the last candle
 const f=t>29?((t-29)*.7)%1:0;set(ring,'r',(8+34*f).toFixed(1));set(ring,'opacity',(t>29?(1-f)*seg(t,29,29.5):0).toFixed(3));set(sig,'opacity',seg(t,30,30.6).toFixed(3));
}

// ===== playback: wall clock only picks the time to request; frame(t) does the rest =====
let t=0,playing=true,last=performance.now();
const pp=document.getElementById('pp'),sl=document.getElementById('sl'),tl=document.getElementById('tl');
function tick(now){if(playing){t=Math.min(DUR,t+(now-last)/1000);if(t>=DUR){playing=false;pp.textContent='Rejouer'}}
 last=now;frame(t);sl.value=Math.round(t*100);tl.textContent=t.toFixed(1)+' s';requestAnimationFrame(tick)}
pp.onclick=()=>{if(t>=DUR)t=0;playing=!playing;pp.textContent=playing?'Pause':'Lecture'};
sl.oninput=()=>{t=sl.value/100;playing=false;pp.textContent='Lecture'};
requestAnimationFrame(tick);

// ===== export: 2560×1440 @ 30 fps, frame-exact (each frame = frame(i/30) → canvas → WebCodecs VP9 → WebM) =====
const EW=2560,EH=1440,FPS=30,exb=document.getElementById('ex');
const cat=a=>{const o=new Uint8Array(a.reduce((s,x)=>s+x.length,0));let p=0;for(const x of a){o.set(x,p);p+=x.length}return o};
const be=(n,l)=>{const a=[];for(let i=l-1;i>=0;i--)a.push(Math.floor(n/2**(8*i))%256);return Uint8Array.from(a)};
const U=n=>{let l=1;while(n>=2**(8*l))l++;return be(n,l)};
const vint=n=>{let l=1;while(n>=2**(7*l)-1)l++;const a=be(n,l);a[0]|=1<<(8-l);return a};
const el=(id,...body)=>{const b=cat(body);return cat([Uint8Array.from(id),vint(b.length),b])};
const F64=v=>{const b=new Uint8Array(8);new DataView(b.buffer).setFloat64(0,v);return b};
const TXT=s=>new TextEncoder().encode(s);
function muxWebM(chunks){ // minimal WebM: header, info, one video track, a cluster per keyframe group
 const head=el([0x1A,0x45,0xDF,0xA3],el([0x42,0x86],U(1)),el([0x42,0xF7],U(1)),el([0x42,0xF2],U(4)),el([0x42,0xF3],U(8)),el([0x42,0x82],TXT('webm')),el([0x42,0x87],U(4)),el([0x42,0x85],U(2)));
 const info=el([0x15,0x49,0xA9,0x66],el([0x2A,0xD7,0xB1],U(1000000)),el([0x44,0x89],F64(DUR*1000)),el([0x4D,0x80],TXT('VidAnimEngine')),el([0x57,0x41],TXT('VidAnimEngine')));
 const tracks=el([0x16,0x54,0xAE,0x6B],el([0xAE],el([0xD7],U(1)),el([0x73,0xC5],U(1)),el([0x83],U(1)),el([0x86],TXT('V_VP9')),el([0xE0],el([0xB0],U(EW)),el([0xBA],U(EH)))));
 const clusters=[];let cur=null,base=0;
 for(const c of chunks){const ms=Math.round(c.ts/1000);
  if(c.key||!cur){if(cur)clusters.push(el([0x1F,0x43,0xB6,0x75],...cur));base=ms;cur=[el([0xE7],U(base))]}
  const rel=ms-base;cur.push(el([0xA3],Uint8Array.from([0x81,(rel>>8)&255,rel&255,c.key?0x80:0]),c.b))}
 if(cur)clusters.push(el([0x1F,0x43,0xB6,0x75],...cur));
 return cat([head,el([0x18,0x53,0x80,0x67],info,tracks,...clusters)])}
const frameToImage=svgEl=>new Promise((ok,ko)=>{const c=svgEl.cloneNode(true);c.setAttribute('width',EW);c.setAttribute('height',EH);
 
 const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(c)],{type:'image/svg+xml'}));
 const im=new Image();im.onload=()=>{URL.revokeObjectURL(url);ok(im)};im.onerror=()=>{URL.revokeObjectURL(url);ko(new Error('svg render'))};im.src=url});
async function exportVideo(){
 if(!window.VideoEncoder){exb.textContent='Export : Chrome / Edge requis';return}
 const dl=await claude.use('downloads');if(!dl){exb.textContent='Export indisponible ici';return}
 playing=false;pp.textContent='Lecture';exb.disabled=true;
 try{
  frame(0);await frameToImage(svg);await document.fonts.ready; // warm-up so embedded fonts are ready
  const cv=document.createElement('canvas');cv.width=EW;cv.height=EH;const g=cv.getContext('2d'),chunks=[];
  const enc=new VideoEncoder({output:c=>{const b=new Uint8Array(c.byteLength);c.copyTo(b);chunks.push({b,ts:c.timestamp,key:c.type==='key'})},error:e=>{throw e}});
  enc.configure({codec:'vp09.00.50.08',width:EW,height:EH,bitrate:16e6,framerate:FPS});
  const total=DUR*FPS;
  for(let f=0;f<total;f++){
   frame(f/FPS); // deterministic: same state as preview/seek
   const im=await frameToImage(svg);g.fillStyle='#110C07';g.fillRect(0,0,EW,EH);g.drawImage(im,0,0,EW,EH);
   const vf=new VideoFrame(cv,{timestamp:Math.round(f*1e6/FPS),duration:Math.round(1e6/FPS)});enc.encode(vf,{keyFrame:f%60===0});vf.close();
   while(enc.encodeQueueSize>6)await new Promise(r=>setTimeout(r,5));
   if(f%10===0){exb.textContent='Export '+Math.round(f/total*100)+' %';tl.textContent=(f/FPS).toFixed(1)+' s'}}
  await enc.flush();enc.close();
  exb.textContent='Enregistrement…';
  await dl.save({filename:'setup-sans-indicateurs-2k-30fps.webm',data:new Blob([muxWebM(chunks)],{type:'video/webm'})});
  exb.textContent='Exporter 2K · 30 fps';
 }catch(e){exb.textContent=e&&e.code==='declined'?'Exporter 2K · 30 fps':'Échec export';console.error(e)}
 exb.disabled=false;t=0;frame(0)}
exb.onclick=exportVideo;
</script></body></html>
