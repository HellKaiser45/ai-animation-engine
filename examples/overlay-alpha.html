<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALPHA · animated broadcast overlay → VP9 WebM with transparency</title>
<style>
:root{--bg:#f2f0ea;--ink:#14162a;--btn:#e2dfd4;--acc:#0aa6c4;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:13px system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0}
.stage{position:relative;width:min(94vw,1100px);aspect-ratio:16/9;overflow:hidden;border-radius:6px;background:#888}
.stage>*{position:absolute;inset:0;width:100%;height:100%}
[data-bg=checker]{background:conic-gradient(#bbb 25%,#fff 0 50%,#bbb 0 75%,#fff 0) 0 0/28px 28px}
[data-bg=video]{background:radial-gradient(60% 80% at 30% 30%,#ff8a3d,transparent 70%),radial-gradient(70% 90% at 80% 70%,#3d6bff,transparent 70%),linear-gradient(120deg,#1b2a4a,#7a3a6a);animation:drift 8s ease-in-out infinite alternate}
[data-bg=white]{background:#fff}[data-bg=green]{background:#10b24a}
@keyframes drift{to{filter:hue-rotate(60deg) brightness(1.15);background-position:40px 20px,-30px 10px,0 0}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;width:min(94vw,1100px)}
button,select{background:var(--btn);color:var(--ink);border:1px solid #8885;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button.go{background:var(--acc);color:#04121a;font-weight:700}input[type=range]{flex:1;min-width:140px}
#st{opacity:.85;text-align:center;max-width:min(94vw,900px)}
</style></head><body>
<div class="stage" id="stage" data-bg="checker"><video id="res" muted loop playsinline style="display:none"></video><canvas id="cv"></canvas></div>
<div class="row"><button id="pp">Pause</button><input id="sl" type="range" min="0" max="600" value="0"><span id="tl">0.0 s</span>
<select id="bgsel" aria-label="backdrop"><option value="checker">Backdrop: checker</option><option value="video">Backdrop: fake video</option><option value="white">Backdrop: white</option><option value="green">Backdrop: green</option></select></div>
<div class="row"><button class="go" id="ex">Export WebM · VP9 + alpha · 1920×1080 · 30 fps</button><button id="show" disabled>Show exported file</button><button id="dl" disabled>Download</button></div>
<div id="st">Checking encoder…</div>
<script>
'use strict';
// ===== helpers ===========================================================================================================
const W=1920,H=1080,DUR=6,FPS=30;                                   // DISPLAY space for the design: 1920x1080 units; any canvas size scales to it
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,t)=>a+(b-a)*t,seg=(t,a,b)=>clamp((t-a)/(b-a));

const CY='70,230,255',MG='255,70,200';

// ===== the overlay: draw(g,t) is a pure function of t, painted on a TRANSPARENT canvas (clearRect, never a background fill) =====
const SPARK=(()=>{const r=rng(5);return Array.from({length:90},(_,i)=>({a:r()*6.2832,sp:260+r()*620,life:.7+r()*.7,w:1.5+r()*3,c:i%3==0?'255,255,255':i%3==1?CY:MG}))})();
function draw(g,t){

  g.save();g.translate(110+lx,108);g.globalAlpha=A;
  g.fillStyle='rgba(255,56,92,.95)';g.beginPath();g.roundRect(0,0,168,54,27);g.fill();
  g.fillStyle=`rgba(255,255,255,${.5+.5*Math.sin(t*6)})`;g.beginPath();g.arc(30,27,8,0,6.2832);g.fill();
  g.fillStyle='#fff';g.font='800 28px system-ui,sans-serif';g.textBaseline='middle';g.fillText('LIVE',50,28);
  g.fillStyle='rgba(8,12,28,.55)';g.beginPath();g.roundRect(182,0,196,54,27);g.fill();
  g.fillStyle='rgba(255,255,255,.92)';g.font='600 24px ui-monospace,monospace';g.fillText('REC 00:0'+Math.floor(t)+'.'+Math.floor(t%1*10),204,28);g.restore();

    g.shadowColor=`rgba(${CY},.8)`;g.shadowBlur=26;g.setLineDash([7,11]);g.lineDashOffset=-t*46;g.strokeStyle=`rgba(${CY},.9)`;g.lineWidth=3;g.beginPath();g.arc(0,0,92,0,6.2832);g.stroke();g.setLineDash([]);

    const ag=g.createLinearGradient(-PW+((t*600)%(PW*2)),0,((t*600)%(PW*2)),0);ag.addColorStop(0,`rgb(${CY})`);ag.addColorStop(.5,'#fff');ag.addColorStop(1,`rgb(${MG})`);g.fillStyle=ag;g.fillRect(0,0,PW,7);
    const lp=eo(seg(t,1.85,2.6));if(lp>0&&lp<1){const x=-260+(PW+520)*lp,sg=g.createLinearGradient(x-90,0,x+90,0);sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.55)');sg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=sg;g.fillRect(x-90,0,180,PH)}
    g.restore();
    const nm='ALEX MERCER',n=Math.floor(seg(t,1.4,2.3)*nm.length),caret=t<4.2&&Math.floor(t*3)%2===0&&t>1.4;
    g.save();g.globalAlpha=A;g.translate(ox+66,oy);g.beginPath();g.rect(-10,0,PW*rv-40,PH);g.clip();g.fillStyle='#fff';g.textBaseline='alphabetic';g.font='800 66px system-ui,sans-serif';g.shadowColor='rgba(0,0,0,.45)';g.shadowBlur=12;
    g.fillText(nm.slice(0,n)+(caret?'▍':''),0,84);g.shadowBlur=0;g.globalAlpha=A*eo(seg(t,2.1,2.7));g.fillStyle=`rgba(${CY},1)`;g.font='600 28px system-ui,sans-serif';g.letterSpacing='5px';g.fillText('MOTION DESIGN · LIVE STUDIO',0,138);g.letterSpacing='0px';g.restore()}
  // --- 3D emblem: low-poly octahedron, rotated, shaded, painter-sorted, with a tilted ring split into back/front halves ---
  const es=pop(seg(t,1.55,2.25)),ex0=1290-ex*140,ey0=868;
  if(es>0){const R=116*es,yaw=t*1.3,tl=.55,L=[-.4,.7,.6];
    const V=[[1,0,0],[-1,0,0],[0,1.3,0],[0,-1.3,0],[0,0,1],[0,0,-1]].map(([x,y,z])=>{let a=x*Math.cos(yaw)+z*Math.sin(yaw),c=-x*Math.sin(yaw)+z*Math.cos(yaw);return[a,y*Math.cos(tl)-c*Math.sin(tl),y*Math.sin(tl)+c*Math.cos(tl)]});

      g.fillStyle=`rgb(${c})`;g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1.5;g.beginPath();q.f.forEach((i,k)=>{const p=P(V[i]);k?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])});g.closePath();g.fill();g.shadowBlur=0;g.stroke()}

// ===== preview + transport ==================================================================================================
const cv=document.getElementById('cv'),g0=cv.getContext('2d',{alpha:true});cv.width=1280;cv.height=720;
let t=0,playing=true,last=performance.now();
const pp=document.getElementById('pp'),sl=document.getElementById('sl'),tl=document.getElementById('tl'),st=document.getElementById('st');sl.max=DUR*100;
function frame(time){g0.setTransform(cv.width/W,0,0,cv.width/W,0,0);draw(g0,time)}
function show(){frame(t);sl.value=Math.round(t*100);tl.textContent=t.toFixed(1)+' s'}
function tick(now){if(playing){t+=Math.min(.1,(now-last)/1000);if(t>=DUR+.6)t=0}last=now;show();requestAnimationFrame(tick)}
pp.onclick=()=>{playing=!playing;pp.textContent=playing?'Pause':'Play'};sl.oninput=()=>{t=sl.value/100;playing=false;pp.textContent='Play'};
window.seek=time=>{playing=false;t=clamp(time,0,DUR);show()};
document.getElementById('bgsel').onchange=e=>document.getElementById('stage').dataset.bg=e.target.value;
requestAnimationFrame(tick);

// ===== VP9 + ALPHA export: WebCodecs keeps the alpha plane as separate side data; the muxer must store it as WebM BlockAdditions =====
const cat=a=>{const o=new Uint8Array(a.reduce((s,x)=>s+x.length,0));let p=0;for(const x of a){o.set(x,p);p+=x.length}return o};

const vint=n=>{let l=1;while(n>=2**(7*l)-1)l++;const a=be(n,l);a[0]|=1<<(8-l);return a};

// ===== UI wiring ============================================================================================================
let outBlob=null;const exb=document.getElementById('ex'),shb=document.getElementById('show'),dlb=document.getElementById('dl'),res=document.getElementById('res');
(async()=>{try{const s=await VideoEncoder.isConfigSupported({codec:'vp09.00.50.08',width:1920,height:1080,bitrate:14e6,framerate:30,});

  st.textContent='Done: '+(outBlob.size/1048576).toFixed(2)+' MB. Use "Show exported file" to see the real WebM played back with its transparency.';shb.disabled=dlb.disabled=false}
  catch(e){st.textContent='Export failed: '+e.message}exb.disabled=false};
shb.onclick=()=>{res.src=URL.createObjectURL(outBlob);res.style.display='block';cv.style.display='none';res.play()};
dlb.onclick=async()=>{try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:'overlay-alpha.webm',data:outBlob});return}}}catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(outBlob);a.download='overlay-alpha.webm';document.body.appendChild(a);a.click();a.remove()};
</script></body></html>
