<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VidAnimEngine — Fantasy Journey</title>
<style>
  :root{
    --bone:#f2ece3;
    --char:#0b0a09;
    --amber:#eda54a;
    --hair:rgba(242,236,227,0.24);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--char);overflow:hidden;-webkit-text-size-adjust:100%}
  #stage{position:fixed;inset:0;overflow:hidden;background:var(--char)}
  #view{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:manipulation}
  #hud{
    position:absolute;left:0;right:0;bottom:0;
    padding:0 20px calc(16px + env(safe-area-inset-bottom,0px));
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--bone);text-shadow:0 1px 3px rgba(0,0,0,.78);
    transition:opacity .22s ease;
  }
  #hud[data-hidden="1"]{opacity:0;pointer-events:none}
  #rail{position:relative;height:1px;background:var(--hair);margin:0 0 12px}
  #fill{position:absolute;left:0;top:-1px;height:3px;width:100%;background:var(--amber);
    transform:scaleX(0);transform-origin:0 50%;will-change:transform}
  #ticks{position:absolute;left:0;right:0;top:-3px;height:7px}
  .tick{position:absolute;top:0;width:1px;height:7px;background:rgba(242,236,227,.34)}
  #row{display:flex;align-items:center;gap:14px}
  #chap{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;white-space:nowrap}
  #ctrls{margin-left:auto;display:flex;align-items:center;gap:6px}
  #tc{font-size:11px;letter-spacing:.12em;font-variant-numeric:tabular-nums;
    color:rgba(242,236,227,.86);white-space:nowrap}
  button.ui{
    appearance:none;background:transparent;border:1px solid rgba(242,236,227,.3);
    color:var(--bone);font-family:inherit;font-size:10px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;line-height:1;padding:7px 9px;min-height:30px;min-width:36px;
    border-radius:2px;cursor:pointer;text-shadow:inherit;
  }
  button.ui:hover{border-color:rgba(242,236,227,.62)}
  button.ui[aria-pressed="true"]{color:var(--amber);border-color:rgba(237,165,74,.72)}
  button.ui:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  #perf{
    position:absolute;top:12px;left:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:10px;line-height:1.55;letter-spacing:.02em;color:var(--bone);
    background:rgba(11,10,9,.62);border:1px solid rgba(242,236,227,.16);
    padding:8px 10px;white-space:pre;pointer-events:none;
  }
  @media (max-width:640px){
    #hud{padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
    #chap{font-size:10px;letter-spacing:.13em}
    #tc{font-size:10px;letter-spacing:.08em}
    #row{gap:10px}
    button.ui{min-height:34px;min-width:34px;font-size:9px;padding:7px 7px;letter-spacing:.1em}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view" role="img" aria-label="Fantasy Journey: a single continuous 60 second flight through a procedural fantasy world — a dawn ridge, a waterfall cliff, an inhabited river village, ancient ruins, a dense forest corridor, and a colossal weathered spire rising from a lake."></canvas>
  <div id="perf" hidden></div>
  <div id="hud">
    <div id="rail"><div id="ticks"></div><div id="fill"></div></div>
    <div id="row">
      <span id="chap">Ridge</span>
      <span id="ctrls">
        <button class="ui" id="btnPlay" type="button" aria-label="Play or pause the animation" aria-pressed="false">Pause</button>
        <button class="ui" id="btnMute" type="button" aria-label="Mute or unmute the procedural soundtrack" aria-pressed="false">Sound</button>
        <button class="ui" id="btnHud" type="button" aria-label="Hide the interface" aria-pressed="false">HUD</button>
      </span>
      <span id="tc">00:00 / 01:00</span>
    </div>
  </div>
</div>
<script>
"use strict";
/* =============================================================================
   VIDANIMENGINE — "FANTASY JOURNEY"
   60 s single continuous take · 30 fps · 1800 frames · one world · one camera.
   Software rasterizer: u32 colour buffer + f32 depth buffer, 560x315 internal,
   nearest-neighbour upscale. No external assets, no network requests.

   Approximations are tagged  [FALLBACK]  with the reason and the choice made.
   ============================================================================= */

/* ============================== 1. CONFIG ================================== */

var CONFIG = {
  W: 560,                 // internal framebuffer width  (fixed, never adaptive)
  H: 315,                 // internal framebuffer height (16:9)
  FPS: 30,
  DURATION: 60,
  NEAR: 0.4,              // near plane distance (metres)
  FAR: 380,
  HB: 8,                  // hemisphere-light buckets   (normal.y)
  SB: 32,                 // sun-shade buckets          (N.L)
  SPB: 4,                 // specular buckets           (N.H)
  FOG_BUCKETS: 16,
  FOG_K: 0.0072,          // exponential fog coefficient per metre
  SUN_PHASES: 8,          // baked sun-colour phases across the 60 s
  DPR_MAX: 2,
  PATH_CLEAR: 7.0         // metres of empty air kept around the camera route
};
var W = CONFIG.W, H = CONFIG.H, NEAR = CONFIG.NEAR, FAR = CONFIG.FAR;
var FRAMES = CONFIG.FPS * CONFIG.DURATION;
var D2R = Math.PI / 180;

/* ============================ 2. MATH / RNG ================================ */

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smoothstep(e0, e1, x) { var t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }
function dist3(ax, ay, az, bx, by, bz) {
  var dx = ax - bx, dy = ay - by, dz = az - bz;
  return Math.sqrt(dx * dx + dy * dy + dz * dz);
}
function dist2(ax, az, bx, bz) { var dx = ax - bx, dz = az - bz; return Math.sqrt(dx * dx + dz * dz); }

/* Seeded PRNG (mulberry32). Every procedural decision in this file draws from a
   named Rng instance so that the world is byte-identical on every load. */
function mulberry32(seed) {
  var a = seed | 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function Rng(seed) { this.next = mulberry32(seed); }
Rng.prototype.f = function () { return this.next(); };
Rng.prototype.range = function (a, b) { return a + (b - a) * this.next(); };
Rng.prototype.int = function (a, b) { return a + Math.floor(this.next() * (b - a + 1)); };
Rng.prototype.pick = function (arr) { return arr[Math.min(arr.length - 1, Math.floor(this.next() * arr.length))]; };
Rng.prototype.sign = function () { return this.next() < 0.5 ? -1 : 1; };

/* Little-endian packed colour: 0xAABBGGRR so a Uint32Array view can be handed
   straight to ImageData (RGBA byte order). */
function packRGB(r, g, b) {
  return ((255 << 24) | ((b & 255) << 16) | ((g & 255) << 8) | (r & 255)) >>> 0;
}

/* Centripetal Catmull-Rom (alpha = 0.5) evaluated on a padded control array.
   P is padded by one point at each end; segment i reads P[i..i+3]. */
function crSample(P, i, u, out) {
  var x0 = P[i][0], y0 = P[i][1], z0 = P[i][2];
  var x1 = P[i + 1][0], y1 = P[i + 1][1], z1 = P[i + 1][2];
  var x2 = P[i + 2][0], y2 = P[i + 2][1], z2 = P[i + 2][2];
  var x3 = P[i + 3][0], y3 = P[i + 3][1], z3 = P[i + 3][2];
  var t0 = 0;
  var t1 = t0 + Math.sqrt(Math.max(1e-4, dist3(x0, y0, z0, x1, y1, z1)));
  var t2 = t1 + Math.sqrt(Math.max(1e-4, dist3(x1, y1, z1, x2, y2, z2)));
  var t3 = t2 + Math.sqrt(Math.max(1e-4, dist3(x2, y2, z2, x3, y3, z3)));
  var t = t1 + (t2 - t1) * u;
  var a1 = (t1 - t) / (t1 - t0), a2 = (t - t0) / (t1 - t0);
  var b1 = (t2 - t) / (t2 - t1), b2 = (t - t1) / (t2 - t1);
  var c1 = (t2 - t) / (t2 - t0), c2 = (t - t0) / (t2 - t0);
  var d1 = (t3 - t) / (t3 - t1), d2 = (t - t1) / (t3 - t1);
  var e1 = (t2 - t) / (t2 - t1), e2 = (t - t1) / (t2 - t1);
  var Ax = a1 * x0 + a2 * x1, Ay = a1 * y0 + a2 * y1, Az = a1 * z0 + a2 * z1;
  var Bx = b1 * x1 + b2 * x2, By = b1 * y1 + b2 * y2, Bz = b1 * z1 + b2 * z2;
  var g1 = (t3 - t) / (t3 - t2), g2 = (t - t2) / (t3 - t2);
  var Cx = g1 * x2 + g2 * x3, Cy = g1 * y2 + g2 * y3, Cz = g1 * z2 + g2 * z3;
  var Dx = c1 * Ax + c2 * Bx, Dy = c1 * Ay + c2 * By, Dz = c1 * Az + c2 * Bz;
  var Ex = d1 * Bx + d2 * Cx, Ey = d1 * By + d2 * Cy, Ez = d1 * Bz + d2 * Cz;
  out[0] = e1 * Dx + e2 * Ex;
  out[1] = e1 * Dy + e2 * Ey;
  out[2] = e1 * Dz + e2 * Ez;
}

/* ====================== 3. MESH BUILDERS (generic) ========================= */

/* Authoring mesh: growable arrays, compiled once into typed arrays.
   Every primitive takes an "inside" hint point; triangles are oriented so their
   normal points away from it, which keeps winding consistent for the whole file
   (so backface rejection can never silently eat a surface). */
function newMesh(name) {
  return { name: name || "mesh", pos: [], tri: [], mat: [], nrm: [], sh: [] };
}
/* Authoring-time loss counters: a dropped face or a NaN coordinate is a bug in
   the builder, never something to swallow. Both are reported by compileMesh. */
var GEO_DROPPED = 0, NAN_FLOATS = 0;
function addTriRaw(m, ax, ay, az, bx, by, bz, cx, cy, cz, mat, hx, hy, hz, shadowed) {
  var ux = bx - ax, uy = by - ay, uz = bz - az;
  var vx = cx - ax, vy = cy - ay, vz = cz - az;
  var nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
  var len = Math.sqrt(nx * nx + ny * ny + nz * nz);
  /* !(len > 1e-9) also catches NaN, which "len < 1e-9" let through as a silently
     degenerate face (NaN < x is false). Only non-finite input is counted: the
     zero-area pole quads primSphere emits are expected and always dropped. */
  if (!(len > 1e-9)) { if (!isFinite(len)) GEO_DROPPED++; return; }
  nx /= len; ny /= len; nz /= len;
  var fx = (ax + bx + cx) / 3 - hx, fy = (ay + by + cy) / 3 - hy, fz = (az + bz + cz) / 3 - hz;
  if (nx * fx + ny * fy + nz * fz < 0) {        // flip to face away from hint
    var tx = bx, ty = by, tz = bz;
    bx = cx; by = cy; bz = cz; cx = tx; cy = ty; cz = tz;
    nx = -nx; ny = -ny; nz = -nz;
  }
  var o = m.pos.length;
  m.pos.push(ax, ay, az, bx, by, bz, cx, cy, cz);
  m.tri.push(o / 3, o / 3 + 1, o / 3 + 2);
  m.nrm.push(nx, ny, nz);
  m.mat.push(mat);
  m.sh.push(shadowed ? 1 : 0);
}
function addQuad(m, ax, ay, az, bx, by, bz, cx, cy, cz, dx, dy, dz, mat, hx, hy, hz, shadowed) {
  addTriRaw(m, ax, ay, az, bx, by, bz, cx, cy, cz, mat, hx, hy, hz, shadowed);
  addTriRaw(m, ax, ay, az, cx, cy, cz, dx, dy, dz, mat, hx, hy, hz, shadowed);
}

/* Compile to typed arrays; vertices welded by position so each unique vertex is
   transformed exactly once per frame. */
function compileMesh(m) {
  var map = new Map();
  var pos = [], tri = [], nrm = [], mats = [], sh = [];
  var nf = m.mat.length;
  for (var f = 0; f < nf; f++) {
    for (var k = 0; k < 3; k++) {
      var vi = m.tri[f * 3 + k];
      var x = m.pos[vi * 3], y = m.pos[vi * 3 + 1], z = m.pos[vi * 3 + 2];
      var key = x.toFixed(3) + "|" + y.toFixed(3) + "|" + z.toFixed(3);
      var id = map.get(key);
      if (id === undefined) {
        id = pos.length / 3;
        map.set(key, id);
        pos.push(x, y, z);
      }
      tri.push(id);
    }
    nrm.push(m.nrm[f * 3], m.nrm[f * 3 + 1], m.nrm[f * 3 + 2]);
    mats.push(m.mat[f]);
    sh.push(m.sh[f]);
  }
  /* A non-finite coordinate welds every affected vertex into one "NaN|NaN|NaN"
     entry and erases the surface, so compile reports it instead of hiding it. */
  var nanFloats = 0;
  for (var q = 0; q < pos.length; q++) if (!isFinite(pos[q])) nanFloats++;
  NAN_FLOATS += nanFloats;
  if (nanFloats > 0 || GEO_DROPPED > 0) {
    console.error("compileMesh(\"" + m.name + "\"): " + nanFloats +
      " non-finite position floats, " + GEO_DROPPED +
      " degenerate faces dropped in total (likely cause: NaN or degenerate primitive input)");
  }
  return {
    name: m.name,
    pos: new Float32Array(pos),
    vcount: pos.length / 3,
    faces: new Uint32Array(tri),
    fcount: nf,
    fnorm: new Float32Array(nrm),
    fmat: new Uint8Array(mats),
    fsh: new Uint8Array(sh)
  };
}

/* Box, axis aligned then yawed about its own centre (trunks, walls, beams). */
function primBox(m, cx, cy, cz, w, h, d, mat, yaw) {
  yaw = yaw || 0;
  var c = Math.cos(yaw), s = Math.sin(yaw);
  var hw = w * 0.5, hh = h * 0.5, hd = d * 0.5;
  var X = [0, 0, 0], Y = [0, 0, 0], Z = [0, 0, 0];
  var i, j, k, p = [];
  for (k = 0; k < 8; k++) {
    X[k] = (k & 1 ? hw : -hw);
    Y[k] = (k & 2 ? hh : -hh);
    Z[k] = (k & 4 ? hd : -hd);
  }
  var wx = [], wy = [], wz = [];
  for (i = 0; i < 8; i++) {
    wx[i] = cx + X[i] * c + Z[i] * s;
    wy[i] = cy + Y[i];
    wz[i] = cz - X[i] * s + Z[i] * c;
  }
  // faces by corner index quads (0..7 with bit packing)
  var F = [
    [0, 2, 3, 1], [4, 5, 7, 6], [0, 1, 5, 4],
    [2, 6, 7, 3], [0, 4, 6, 2], [1, 3, 7, 5]
  ];
  for (j = 0; j < 6; j++) {
    var q = F[j];
    addQuad(m, wx[q[0]], wy[q[0]], wz[q[0]], wx[q[1]], wy[q[1]], wz[q[1]],
      wx[q[2]], wy[q[2]], wz[q[2]], wx[q[3]], wy[q[3]], wz[q[3]], mat, cx, cy, cz);
  }
}
/* Lathe / revolve around a vertical axis. profile = [[r,y], ...] bottom->top.
   [FALLBACK] open profiles are closed with a fan cap at both ends. */
function primLathe(m, prof, segs, cx, cy, cz, mat, capBottom, capTop, a0, a1) {
  var n = prof.length;
  /* a0/a1 default to a full revolution; `full` is derived after defaulting so a
     short call form cannot produce NaN angles. */
  if (a0 === undefined) a0 = 0;
  if (a1 === undefined) a1 = Math.PI * 2;
  var full = (a1 - a0) >= Math.PI * 2 - 1e-6;
  var i, j;
  for (i = 0; i < n - 1; i++) {
    var r0 = prof[i][0], y0 = prof[i][1], r1 = prof[i + 1][0], y1 = prof[i + 1][1];
    for (j = 0; j < segs; j++) {
      var t0 = a0 + (a1 - a0) * (j / segs);
      var t1 = a0 + (a1 - a0) * ((j + 1) / segs);
      var cyMid = (y0 + y1) * 0.5;
      var ax = cx + Math.cos(t0) * r0, az = cz + Math.sin(t0) * r0;
      var bx = cx + Math.cos(t1) * r0, bz = cz + Math.sin(t1) * r0;
      var ccx = cx + Math.cos(t1) * r1, ccz = cz + Math.sin(t1) * r1;
      var dx = cx + Math.cos(t0) * r1, dz = cz + Math.sin(t0) * r1;
      addQuad(m, ax, cy + y0, az, bx, cy + y0, bz, ccx, cy + y1, ccz, dx, cy + y1, dz,
        mat, cx, cy + cyMid, cz);
    }
  }
  if (!full) {
    // flat closing wall on the two open sides of a partial revolve
    for (i = 0; i < n - 1; i++) {
      var rr0 = prof[i][0], yy0 = prof[i][1], rr1 = prof[i + 1][0], yy1 = prof[i + 1][1];
      addQuad(m, cx + Math.cos(a0) * rr0, cy + yy0, cz + Math.sin(a0) * rr0,
        cx + Math.cos(a0) * rr1, cy + yy1, cz + Math.sin(a0) * rr1,
        cx + Math.cos(a1) * rr1, cy + yy1, cz + Math.sin(a1) * rr1,
        cx + Math.cos(a1) * rr0, cy + yy0, cz + Math.sin(a1) * rr0,
        mat, cx, cy + (yy0 + yy1) * 0.5, cz);
    }
  }
  if (capBottom && prof[0][0] > 1e-4) {
    for (j = 0; j < segs; j++) {
      var bb0 = a0 + (a1 - a0) * (j / segs), bb1 = a0 + (a1 - a0) * ((j + 1) / segs);
      addTriRaw(m, cx, cy + prof[0][1], cz,
        cx + Math.cos(bb0) * prof[0][0], cy + prof[0][1], cz + Math.sin(bb0) * prof[0][0],
        cx + Math.cos(bb1) * prof[0][0], cy + prof[0][1], cz + Math.sin(bb1) * prof[0][0],
        mat, cx, cy + prof[0][1] + 1, cz);
    }
  }
  if (capTop && prof[n - 1][0] > 1e-4) {
    for (j = 0; j < segs; j++) {
      var tt0 = a0 + (a1 - a0) * (j / segs), tt1 = a0 + (a1 - a0) * ((j + 1) / segs);
      addTriRaw(m, cx, cy + prof[n - 1][1], cz,
        cx + Math.cos(tt0) * prof[n - 1][0], cy + prof[n - 1][1], cz + Math.sin(tt0) * prof[n - 1][0],
        cx + Math.cos(tt1) * prof[n - 1][0], cy + prof[n - 1][1], cz + Math.sin(tt1) * prof[n - 1][0],
        mat, cx, cy + prof[n - 1][1] - 1, cz);
    }
  }
}
/* Low-poly UV sphere (canopy clusters, rocks, heads). */
function primSphere(m, cx, cy, cz, rx, ry, rz, segs, rings, mat) {
  var i, j;
  for (i = 0; i < rings; i++) {
    var p0 = -Math.PI / 2 + Math.PI * (i / rings);
    var p1 = -Math.PI / 2 + Math.PI * ((i + 1) / rings);
    for (j = 0; j < segs; j++) {
      var t0 = Math.PI * 2 * (j / segs), t1 = Math.PI * 2 * ((j + 1) / segs);
      var ax = cx + Math.cos(p0) * Math.cos(t0) * rx, ay = cy + Math.sin(p0) * ry, az = cz + Math.cos(p0) * Math.sin(t0) * rz;
      var bx = cx + Math.cos(p0) * Math.cos(t1) * rx, by = cy + Math.sin(p0) * ry, bz = cz + Math.cos(p0) * Math.sin(t1) * rz;
      var ccx = cx + Math.cos(p1) * Math.cos(t1) * rx, ccy = cy + Math.sin(p1) * ry, ccz = cz + Math.cos(p1) * Math.sin(t1) * rz;
      var dx = cx + Math.cos(p1) * Math.cos(t0) * rx, dy = cy + Math.sin(p1) * ry, dz = cz + Math.cos(p1) * Math.sin(t0) * rz;
      addQuad(m, ax, ay, az, bx, by, bz, ccx, ccy, ccz, dx, dy, dz, mat, cx, cy, cz);
    }
  }
}
/* Gable roof: ridge runs along local X, eaves at y = 0. */
function primGable(m, cx, cy, cz, w, d, hgt, mat, yaw) {
  var c = Math.cos(yaw), s = Math.sin(yaw);
  function pt(x, y, z) { return [cx + x * c + z * s, cy + y, cz - x * s + z * c]; }
  var hw = w * 0.5, hd = d * 0.5;
  var a = pt(-hw, 0, -hd), b = pt(hw, 0, -hd), cc = pt(hw, 0, hd), dd = pt(-hw, 0, hd);
  var r0 = pt(-hw, hgt, 0), r1 = pt(hw, hgt, 0);
  addQuad(m, a[0], a[1], a[2], b[0], b[1], b[2], r1[0], r1[1], r1[2], r0[0], r0[1], r0[2], mat, cx, cy + hgt * 0.35, cz);
  addQuad(m, cc[0], cc[1], cc[2], dd[0], dd[1], dd[2], r0[0], r0[1], r0[2], r1[0], r1[1], r1[2], mat, cx, cy + hgt * 0.35, cz);
  addTriRaw(m, a[0], a[1], a[2], r0[0], r0[1], r0[2], dd[0], dd[1], dd[2], mat, cx, cy + hgt * 0.3, cz);
  addTriRaw(m, b[0], b[1], b[2], cc[0], cc[1], cc[2], r1[0], r1[1], r1[2], mat, cx, cy + hgt * 0.3, cz);
}

/* Material ids. Base colours live in SHADING PALETTE; builders only reference ids. */
var MAT = {
  grass: 0, grassDry: 1, rock: 2, rockDark: 3, sand: 4, path: 5,
  plaster: 6, roofTile: 7, roofThatch: 8, wood: 9, woodDark: 10,
  stone: 11, window: 12, conifer: 13, broadleaf: 14, moss: 15,
  cobble: 16, spireStone: 17, gold: 18, fern: 19
};
var NMAT = 20;

/* ---------- region asset builders (named, reused by WORLD ASSEMBLY) -------- */

/* RIDGE: wind-bent dead tree. */
function buildDeadTree(seed) {
  var r = new Rng(seed), m = newMesh("deadTree");
  var h = r.range(7, 9);
  primLathe(m, [[0.55, 0], [0.34, h * 0.45], [0.18, h]], 5, 0, 0, 0, MAT.woodDark, false, false);
  for (var i = 0; i < 5; i++) {

/* Standing arch: two piers + a voussoir band. Opening is deliberately tall and
   wide so the authored camera flies clean through it (near-plane safe). */
function buildStandingArch(span, pierTop, thick) {
  var m = newMesh("arch");
  var rr = span * 0.5;
  primBox(m, -rr - thick * 0.5, pierTop * 0.5, 0, thick, pierTop, thick * 2.0, MAT.stone, 0);
  primBox(m, rr + thick * 0.5, pierTop * 0.5, 0, thick, pierTop, thick * 2.0, MAT.stone, 0);
  var N = 9;
  for (var i = 0; i < N; i++) {
    var a0 = Math.PI * (i / N), a1 = Math.PI * ((i + 1) / N);
    var ix0 = Math.cos(a0) * rr, iy0 = pierTop + Math.sin(a0) * rr;
    var ix1 = Math.cos(a1) * rr, iy1 = pierTop + Math.sin(a1) * rr;
    var ox0 = Math.cos(a0) * (rr + thick), oy0 = pierTop + Math.sin(a0) * (rr + thick);
    var ox1 = Math.cos(a1) * (rr + thick), oy1 = pierTop + Math.sin(a1) * (rr + thick);
    var zz = thick * 1.0;
    addQuad(m, ix0, iy0, zz, ox0, oy0, zz, ox1, oy1, zz, ix1, iy1, zz, MAT.stone, 0, pierTop + rr, 0);
    addQuad(m, ix0, iy0, -zz, ix1, iy1, -zz, ox1, oy1, -zz, ox0, oy0, -zz, MAT.stone, 0, pierTop + rr, 0);
    addQuad(m, ox0, oy0, zz, ox1, oy1, zz, ox1, oy1, -zz, ox0, oy0, -zz, MAT.stone, 0, pierTop + rr, 0);
    addQuad(m, ix0, iy0, zz, ix0, iy0, -zz, ix1, iy1, -zz, ix1, iy1, zz, MAT.stone, 0, pierTop + rr, 0);
  }
  return compileMesh(m);
}

/* HERO LANDMARK: colossal weathered spire, lathe shaft + stacked tiers +
   arched windows + broken crown. ~116 m from lake to crown. */
var SPIRE_PROFILE = [
  [14.5, -3], [13.2, 1], [11.8, 8], [10.9, 16], [10.2, 24],
  [10.8, 29], [9.2, 38], [8.6, 48], [9.4, 54], [8.0, 64],
  [7.4, 74], [8.0, 79], [6.6, 90], [5.9, 99], [6.4, 104],
  [4.8, 111], [4.0, 116]
];
function spireRadiusAt(y) {
  var P = SPIRE_PROFILE;
  if (y <= P[0][1]) return P[0][0];
  for (var i = 0; i < P.length - 1; i++) {
    if (y >= P[i][1] && y <= P[i + 1][1]) {
      var t = (y - P[i][1]) / Math.max(0.001, P[i + 1][1] - P[i][1]);
      return lerp(P[i][0], P[i + 1][0], t);
    }
  }
  return P[P.length - 1][0];
}
function buildSpire() {
  var m = newMesh("spire");
  var segs = 16, i, j;
  primLathe(m, SPIRE_PROFILE, segs, 0, 0, 0, MAT.spireStone, true, false);
  // tier ledges
  var ledges = [24, 38, 54, 74, 90, 104];
  for (i = 0; i < ledges.length; i++) {
    var y = ledges[i], rad = spireRadiusAt(y);
    primLathe(m, [[rad * 0.98, y - 0.9], [rad * 1.22, y - 0.9], [rad * 1.22, y + 0.7], [rad * 1.0, y + 0.7]],
      segs, 0, 0, 0, MAT.spireStone, true, true);
  }
  // buttresses at the base
  for (i = 0; i < 4; i++) {
    var a = Math.PI * 0.25 + i * Math.PI * 0.5;
    var bx = Math.cos(a) * 11.5, bz = Math.sin(a) * 11.5;
    primBox(m, bx, 9, bz, 3.4, 26, 3.4, MAT.spireStone, -a);
    primBox(m, bx * 1.25, 3, bz * 1.25, 4.6, 8, 4.6, MAT.spireStone, -a);
  }
  // arched windows: [FALLBACK] cut as inset emissive quads + stone sills instead
  // of true CSG openings, so the surface stays a closed convex-ish solid.
  var levels = [16, 30, 46, 62, 78, 94];
  for (i = 0; i < levels.length; i++) {
    var wy = levels[i], wr = spireRadiusAt(wy) + 0.22;
    for (j = 0; j < 6; j++) {
      var ang = j * (Math.PI * 2 / 6) + (i % 2) * 0.35;
      var cxw = Math.cos(ang) * wr, czw = Math.sin(ang) * wr;
      var tx = -Math.sin(ang), tz = Math.cos(ang);
      var hw = 0.95, hh = 2.3;
      // face plane normal points outward along (cos,0,sin)
      var nx = Math.cos(ang), nz = Math.sin(ang), ox = nx * 0.12, oz = nz * 0.12;
      addQuad(m,
        cxw - tx * hw + ox, wy - hh, czw - tz * hw + oz,
        cxw + tx * hw + ox, wy - hh, czw + tz * hw + oz,
        cxw + tx * hw + ox, wy + hh * 0.4, czw + tz * hw + oz,
        cxw - tx * hw + ox, wy + hh * 0.4, czw - tz * hw + oz,
        MAT.window, 0, wy, 0);
      addTriRaw(m,
        cxw - tx * hw + ox, wy + hh * 0.4 + oz, czw - tz * hw + oz,
        cxw + tx * hw + ox, wy + hh * 0.4 + oz, czw + tz * hw + oz,
        cxw + ox, wy + hh * 1.1 + oz, czw + oz,
        MAT.window, 0, wy, 0);
      primBox(m, cxw + nx * 0.35, wy + hh * 1.25, czw + nz * 0.35, 2.6, 0.5, 0.9, MAT.spireStone, -ang);
    }
  }
  // broken crown: partial jagged ring (the top of the shaft is sheared away)
  var crownY = 116, cr = spireRadiusAt(crownY);
  for (i = 0; i < 10; i++) {
    var a0 = i * (Math.PI * 2 / 10), a1 = (i + 1) * (Math.PI * 2 / 10);
    var hgt = (i % 3 === 0) ? 7.5 : (i % 3 === 1 ? 3.0 : 0.8);
    var r0 = cr * 1.06, r1 = cr * 0.55;
    addQuad(m,
      Math.cos(a0) * r0, crownY, Math.sin(a0) * r0,
      Math.cos(a1) * r0, crownY, Math.sin(a1) * r0,
      Math.cos(a1) * r1, crownY + hgt, Math.sin(a1) * r1,
      Math.cos(a0) * r1, crownY + hgt, Math.sin(a0) * r1,
      MAT.spireStone, 0, crownY, 0);
    addTriRaw(m,
      Math.cos(a0) * r1, crownY + hgt, Math.sin(a0) * r1,
      Math.cos(a1) * r1, crownY + hgt, Math.sin(a1) * r1,
      0, crownY + hgt * 0.35, 0,
      MAT.spireStone, 0, crownY, 0);
  }
  return compileMesh(m);
}
/* Distant layered ridges for the opening vista and the far shore of the lake.
   [FALLBACK] static silhouette strips, no erosion simulation. */
function buildDistantRidge(seed, x0, x1, zBase, height, depth, mat) {
  var r = new Rng(seed), m = newMesh("ridge");
  var n = 26, i, prevTop = 0;
  for (i = 0; i <= n; i++) {
    var f = i / n, x = lerp(x0, x1, f);
    var hh = height * (0.55 + 0.45 * Math.sin(f * 7.3 + seed * 0.7) * Math.cos(f * 3.1 + seed * 0.31)) * r.range(0.82, 1.18);
    hh *= Math.sin(Math.PI * clamp(f * 1.06, 0, 1));
    if (i === 0) { prevTop = hh; continue; }
    var xp = lerp(x0, x1, (i - 1) / n);
    addQuad(m, xp, -30, zBase, x, -30, zBase, x, hh, zBase, xp, prevTop, zBase, mat, 0, 0, zBase - depth);
    prevTop = hh;
  }
  return compileMesh(m);
}

/* ==================== 4. WORLD ASSEMBLY (authored) ======================== */

/* One heightfield drives terrain, water beds, object grounding and the shadow
   bake, so every region shares the same world coordinates. */
var LAKE_Y = 1.0;
var ISLE_X = 14, ISLE_Z = 138;

function ridgeProfile(x, z) {
  return 50 + 5 * Math.sin(x * 0.052 + 0.6) + 3 * Math.sin(z * 0.071 + 1.7)
    + 1.6 * Math.sin((x * 0.9 - z) * 0.11) + clamp((-62 - z) * 0.28, 0, 7);
}
function valleyProfile(x, z) {
  return 3.0 + 1.2 * Math.sin(x * 0.07 + 2.1) * Math.sin(z * 0.05)
    + 0.7 * Math.sin((x + z) * 0.13 + 0.5);
}
function riverX(z) { return 4 * Math.sin(z * 0.045) + 2.2 * Math.sin(z * 0.11 + 1.0); }

function terrainHeight(x, z) {
  var h = ridgeProfile(x, z);
  h = lerp(h, valleyProfile(x, z), smoothstep(-63, -48, z));          // waterfall cliff
  h += smoothstep(38, 62, z) * (2.2 + 1.4 * Math.sin(x * 0.09 + 1.1) * Math.sin(z * 0.13)); // forest hills
  h = lerp(h, -3.4 + 0.8 * Math.sin(x * 0.1) * Math.sin(z * 0.12), smoothstep(62, 80, z));  // lake basin
  var d = Math.abs(x - riverX(z));
  var carve = clamp(1 - d / (7.5 + 1.6 * Math.sin(z * 0.2)), 0, 1);
  h -= carve * carve * 2.6;                                            // river channel
  var di = dist2(x, z, ISLE_X, ISLE_Z);
  h = Math.max(h, 4.6 * smoothstep(30, 9, di) - 0.3 + 0.6 * Math.sin(x * 0.4) * smoothstep(18, 8, di));
  return h;
}
function terrainMat(y, ny, x, z) {
  if (ny < 0.58) return MAT.rock;
  if (z > 58 && y < LAKE_Y + 1.4) return MAT.sand;
  if (z < -40 && z > -70) return MAT.rockDark;
  if (z > 40 && z < 66) return MAT.moss;
  if (z > 14 && z < 48 && x < -10) return MAT.grassDry;
  return (Math.sin(x * 0.23) + Math.cos(z * 0.19) > 0.75) ? MAT.grassDry : MAT.grass;
}

var WORLD = { objects: [], smoke: [], glow: [] };
function meshLocalRadius(m) {
  if (m._rad !== undefined) return m._rad;
  var r = 0;
  for (var i = 0; i < m.vcount; i++) {
    var x = m.pos[i * 3], y = m.pos[i * 3 + 1], z = m.pos[i * 3 + 2];
    var d = x * x + y * y + z * z;
    if (d > r) r = d;
  }
  m._rad = Math.sqrt(r);
  return m._rad;
}
function addObject(mesh, x, y, z, yaw, scale, kind) {
  var o = {
    mesh: mesh, x: x, y: y, z: z, yaw: yaw || 0,

  var bus = ctx.createGain();
  bus.gain.value = 1;
  bus.connect(master); bus.connect(conv);
  AUD.master = master; AUD.bus = bus; AUD.conv = conv; AUD.wet = wet;

  var lp = ctx.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.value = 470; lp.Q.value = 0.7;
  var dg = ctx.createGain();
  dg.gain.value = 0;
  lp.connect(dg); dg.connect(bus);
  var det = [55, 82.5, 110.2];
  for (var i = 0; i < det.length; i++) {
    var o = ctx.createOscillator();
    o.type = i === 2 ? "triangle" : "sawtooth";
    o.frequency.value = det[i];
    o.detune.value = (i - 1) * 8;
    o.connect(lp); o.start();
  }
  var lfo = ctx.createOscillator();
  lfo.frequency.value = 0.07;
  var lg = ctx.createGain();
  lg.gain.value = 190;
  lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  AUD.droneGain = dg;

  var noise = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 2), ctx.sampleRate);
  var nd = noise.getChannelData(0);
  var nr = new Rng(9182);
  for (var s = 0; s < nd.length; s++) nd[s] = nr.range(-1, 1) * 0.7;
  function layer(type, freq, q) {
    var src = ctx.createBufferSource();
    src.buffer = noise; src.loop = true;
    var bp = ctx.createBiquadFilter();
    bp.type = type; bp.frequency.value = freq; bp.Q.value = q;
    var g = ctx.createGain();
    g.gain.value = 0;
    src.connect(bp); bp.connect(g); g.connect(bus); src.start();
    return g;
  }
  AUD.windGain = layer("bandpass", 520, 0.55);
  AUD.waterGain = layer("bandpass", 1500, 1.1);
  AUD.ready = true;
  audioSeek(ST.t);
}
function audioSeek(t) {
  if (!AUD.ready) return;
  for (var i = 0; i < AUD.voices.length; i++) {
    try { AUD.voices[i].stop(); } catch (e) { /* already stopped */ }
  }
  AUD.voices.length = 0;
  AUD.originT = t;
  AUD.origin = AUD.ctx.currentTime;
  AUD.nextNote = 0;
  while (AUD.nextNote < AUD.notes.length && AUD.notes[AUD.nextNote].t < t - 0.04) AUD.nextNote++;
}
function bell(when, f, g, d) {
  var ctx = AUD.ctx;
  var o = ctx.createOscillator(), o2 = ctx.createOscillator();
  o.type = "sine"; o.frequency.value = f;
  o2.type = "sine"; o2.frequency.value = f * 2.004;
  var gn = ctx.createGain(), gn2 = ctx.createGain();
  gn.gain.setValueAtTime(0.0001, when);
  gn.gain.exponentialRampToValueAtTime(g, when + 0.03);
  gn.gain.exponentialRampToValueAtTime(0.0001, when + d);
  gn2.gain.setValueAtTime(0.0001, when);
  gn2.gain.exponentialRampToValueAtTime(g * 0.3, when + 0.02);
  gn2.gain.exponentialRampToValueAtTime(0.0001, when + d * 0.6);
  o.connect(gn); gn.connect(AUD.bus);
  o2.connect(gn2); gn2.connect(AUD.bus);
  o.start(when); o2.start(when);
  o.stop(when + d + 0.05); o2.stop(when + d + 0.05);
  AUD.voices.push(o, o2);
}
function swell(when) {
  var ctx = AUD.ctx;
  var o = ctx.createOscillator();
  o.type = "sine"; o.frequency.setValueAtTime(41, when);
  o.frequency.linearRampToValueAtTime(55, when + 6);
  var g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(0.34, when + 5.2);
  g.gain.linearRampToValueAtTime(0.0001, when + 9.5);
  o.connect(g); g.connect(AUD.bus);
  o.start(when); o.stop(when + 9.8);
  AUD.voices.push(o);
}
function hit(when) {
  var ctx = AUD.ctx;
  var o = ctx.createOscillator();
  o.type = "sine";
  o.frequency.setValueAtTime(120, when);
  o.frequency.exponentialRampToValueAtTime(38, when + 0.5);
  var g = ctx.createGain();
  g.gain.setValueAtTime(0.42, when);
  g.gain.exponentialRampToValueAtTime(0.0001, when + 2.2);
  o.connect(g); g.connect(AUD.bus);
  o.start(when); o.stop(when + 2.4);
  AUD.voices.push(o);
}
function audioTick(t) {
  if (!AUD.ready) return;
  var now = AUD.ctx.currentTime;
  var mix = mixFor(t);
  AUD.droneGain.gain.setTargetAtTime(mix.pad, now, 0.15);
  AUD.windGain.gain.setTargetAtTime(mix.wind, now, 0.15);
  AUD.waterGain.gain.setTargetAtTime(mix.water, now, 0.15);
  AUD.wet.gain.setTargetAtTime(mix.wet, now, 0.2);
  var look = now + 0.4;
  while (AUD.nextNote < AUD.notes.length) {
    var n = AUD.notes[AUD.nextNote];
    var when = AUD.origin + (n.t - AUD.originT);
    if (when > look) break;
    if (when >= now - 0.03) {
      if (n.swell) swell(when);
      else if (n.hit) hit(when);
      else bell(when, n.f, n.g, n.d);
    }
    AUD.nextNote++;
  }
  if (AUD.voices.length > 220) AUD.voices.splice(0, AUD.voices.length - 220);
}
function setMuted(m) {
  AUD.muted = m;
  if (AUD.master) AUD.master.gain.setTargetAtTime(m ? 0 : 0.85, AUD.ctx.currentTime, 0.05);
  if (HUD.muteBtn) {
    HUD.muteBtn.setAttribute("aria-pressed", m ? "true" : "false");
    HUD.muteBtn.textContent = m ? "Muted" : "Sound";
    HUD.muteBtn.setAttribute("aria-label", m ? "Unmute the procedural soundtrack" : "Mute the procedural soundtrack");
  }
}

/* ============================== 12. HUD ================================== */
var HUD = { chapEl: null, tcEl: null, fillEl: null, playBtn: null, muteBtn: null, hudBtn: null, perfEl: null, root: null, hidden: false, perf: false, lastPerf: 0 };
function fmtTime(t) {
  var s = Math.max(0, Math.min(CONFIG.DURATION, t));
  var m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return (m < 10 ? "0" : "") + m + ":" + (sec < 10 ? "0" : "") + sec;
}
function initHUD() {
  HUD.root = document.getElementById("hud");
  HUD.chapEl = document.getElementById("chap");
  HUD.tcEl = document.getElementById("tc");
  HUD.fillEl = document.getElementById("fill");
  HUD.playBtn = document.getElementById("btnPlay");
  HUD.muteBtn = document.getElementById("btnMute");
  HUD.hudBtn = document.getElementById("btnHud");
  HUD.perfEl = document.getElementById("perf");
  var ticks = document.getElementById("ticks");
  for (var i = 1; i < CHAPTERS.length; i++) {
    var d = document.createElement("div");
    d.className = "tick";
    d.style.left = (CHAPTERS[i].t0 / CONFIG.DURATION * 100) + "%";
    ticks.appendChild(d);
  }
  HUD.playBtn.addEventListener("click", function () { setPlaying(!PLAY.playing); ensureAudio(); });
  HUD.muteBtn.addEventListener("click", function () { ensureAudio(); setMuted(!AUD.muted); });
  HUD.hudBtn.addEventListener("click", function () { setHudHidden(!HUD.hidden); });
  var view = document.getElementById("view");
  view.addEventListener("pointerdown", function () { ensureAudio(); setPlaying(!PLAY.playing); });
  window.addEventListener("keydown", onKey);
  window.addEventListener("resize", resizeView);
  updateHUD(evaluate(0));
}
function ensureAudio() {
  if (!AUD.ready) {
    audioStart();
    if (AUD.ready) setMuted(AUD.muted);
  } else if (AUD.ctx.state === "suspended") {
    AUD.ctx.resume();
  }
}
function updateHUD(st) {
  var t = st ? st.t : PLAY.baseT;
  HUD.chapEl.textContent = st ? st.chapterName : CHAPTERS[0].name;
  HUD.tcEl.textContent = fmtTime(t) + " / " + fmtTime(CONFIG.DURATION);
  HUD.fillEl.style.transform = "scaleX(" + (t / CONFIG.DURATION).toFixed(5) + ")";
  HUD.playBtn.textContent = PLAY.playing ? "Pause" : "Play";
  HUD.playBtn.setAttribute("aria-pressed", PLAY.playing ? "false" : "true");
}
function setHudHidden(v) {
  HUD.hidden = v;
  HUD.root.setAttribute("data-hidden", v ? "1" : "0");
  HUD.hudBtn.setAttribute("aria-pressed", v ? "true" : "false");
  HUD.hudBtn.setAttribute("aria-label", v ? "Show the interface" : "Hide the interface");
}
function setPerf(v) {
  HUD.perf = v;
  HUD.perfEl.hidden = !v;
}
function updatePerf() {
  if (!HUD.perf) return;
  HUD.perfEl.textContent =
    "frame   " + STATS.ms.toFixed(2) + " ms\n" +
    "frame # " + STATS.frame + " / " + (FRAMES - 1) + "\n" +
    "faces   " + STATS.faces + "  tris " + STATS.tris + "\n" +
    "objects " + STATS.objs + " / " + WORLD.objects.length + "\n" +
    "res     " + W + "x" + H + " (internal)\n" +
    "meshes  " + WORLD.objects.length + "  water " + WATER.vcount + "v\n" +
    "palette " + PALS.length + " phases x " + (NMAT * HB * SB * SPB) + "";
}
function onKey(e) {
  var k = e.key;
  if (k === " " || k === "Spacebar") { e.preventDefault(); ensureAudio(); setPlaying(!PLAY.playing); return; }
  if (k === "ArrowRight") { e.preventDefault(); nudge(e.shiftKey ? 0.1 : 1); ensureAudio(); return; }
  if (k === "ArrowLeft") { e.preventDefault(); nudge(e.shiftKey ? -0.1 : -1); ensureAudio(); return; }
  if (k === "h" || k === "H") { setHudHidden(!HUD.hidden); return; }
  if (k === "m" || k === "M") { ensureAudio(); setMuted(!AUD.muted); return; }
  if (k === "p" || k === "P") { setPerf(!HUD.perf); updatePerf(); return; }
}

/* ============================ 13. MAIN LOOP ============================== */
var PLAY = { playing: true, base: 0, baseT: 0, frame: -1 };
var FROZEN = false;
function currentT(nowMs) {
  if (!PLAY.playing) return PLAY.baseT;
  return Math.min(CONFIG.DURATION, PLAY.baseT + (nowMs - PLAY.base) / 1000);
}
function renderFrame(n) {
  n = Math.max(0, Math.min(FRAMES - 1, n | 0));
  var t0 = performance.now();
  var st = evaluate(n / CONFIG.FPS);
  drawScene(st);
  STATS.ms = performance.now() - t0;
  STATS.frame = n;
  PLAY.frame = n;
  present();
  if (HUD.tcEl) updateHUD(st);
  return st;
}
function drawScene(st) {
  camSet(st.px, st.py, st.pz, st.tx, st.ty, st.tz, st.fov, st.bank);
  st.sunVX = st.sunX * CAM.rx + st.sunY * CAM.ry + st.sunZ * CAM.rz;
  st.sunVY = st.sunX * CAM.ux + st.sunY * CAM.uy + st.sunZ * CAM.uz;
  st.sunVZ = -(st.sunX * CAM.fx + st.sunY * CAM.fy + st.sunZ * CAM.fz);
  STATS.faces = 0; STATS.tris = 0; STATS.objs = 0;
  clearSky(st);
  stampSun(st);
  for (var i = 0; i < WORLD.objects.length; i++) drawObject(WORLD.objects[i], st);
  drawWater(st);
  drawParticles(st);
}
function setPlaying(p) {
  if (p === PLAY.playing) return;
  if (!p) PLAY.baseT = currentT(performance.now());
  PLAY.playing = p;
  if (p) {
    PLAY.base = performance.now();
    if (AUD.ready) audioSeek(PLAY.baseT);
  }
  updateHUD(evaluate(PLAY.baseT));
}
function seekTo(t) {
  PLAY.baseT = Math.max(0, Math.min(CONFIG.DURATION, t));
  PLAY.base = performance.now();
  if (AUD.ready) audioSeek(PLAY.baseT);
  renderFrame(Math.min(FRAMES - 1, Math.round(PLAY.baseT * CONFIG.FPS)));
  if (AUD.ready) audioTick(PLAY.baseT);
}
function nudge(dt) {
  PLAY.playing = false;
  seekTo(PLAY.baseT + dt);
  updateHUD(evaluate(PLAY.baseT));
}
function tick(now) {
  requestAnimationFrame(tick);
  if (vCanvas && (vCanvas.clientWidth !== vCanvas._cw || vCanvas.clientHeight !== vCanvas._ch)) {
    vCanvas._cw = vCanvas.clientWidth;
    vCanvas._ch = vCanvas.clientHeight;
    resizeView();
  }
  if (FROZEN) return;
  var t = currentT(now);
  if (t >= CONFIG.DURATION && PLAY.playing) {
    PLAY.playing = false;
    PLAY.baseT = CONFIG.DURATION;
    updateHUD(evaluate(CONFIG.DURATION));
  }
  if (PLAY.playing) {
    var n = Math.min(FRAMES - 1, Math.floor(t * CONFIG.FPS));
    if (n !== PLAY.frame) {
      renderFrame(n);
      audioTick(n / CONFIG.FPS);
    }
  }
  if (HUD.perf && now - HUD.lastPerf > 240) { HUD.lastPerf = now; updatePerf(); }
}
function checksum(n) {
  renderFrame(n);
  var h = 2166136261;
  for (var i = 0; i < colorBuf.length; i++) {
    h ^= colorBuf[i];
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(16);
}
function selfTest() {
  var frames = [0, 300, 600, 900, 1200, 1500, 1799];
  var lines = [], t0 = performance.now();
  var ok = true;
  for (var i = 0; i < frames.length; i++) {
    var c0 = performance.now();
    var h = checksum(frames[i]);
    lines.push("  f" + frames[i] + "  " + h + "  " + (performance.now() - c0).toFixed(1) + "ms");
    if (!/^[0-9a-f]{1,8}$/.test(h)) ok = false;
  }
  var a = checksum(600), b = checksum(600);
  var same = a === b;
  var msg = "SELFTEST " + (same && ok ? "PASS" : "FAIL") + " | f600 x2 = " + a + ", " + b +
    " | " + (performance.now() - t0).toFixed(0) + "ms for 9 renders";
  console.log(msg);
  console.log(lines.join("\n"));
  document.title = msg;
  return same && ok;
}
function bench() {
  var ms = new Float32Array(FRAMES), total = 0, peakTris = 0, i;
  var t0 = performance.now();
  for (i = 0; i < FRAMES; i++) {
    var a = performance.now();
    renderFrame(i);
    ms[i] = performance.now() - a;
    total += ms[i];
    if (STATS.tris > peakTris) peakTris = STATS.tris;
  }
  var sorted = Array.prototype.slice.call(ms).sort(function (x, y) { return x - y; });
  var p95 = sorted[Math.floor(FRAMES * 0.95)];
  var msg = "BENCH avg " + (total / FRAMES).toFixed(2) + " ms p95 " + p95.toFixed(2) +
    " ms peakTris " + peakTris + " wall " + ((performance.now() - t0) / 1000).toFixed(1) + "s";
  console.log(msg);
  document.title = msg;
}
function exposeAPI() {
  window.__vidanim = {
    evaluate: function (t) { return evaluate(t); },
    renderFrame: function (n) { renderFrame(n); },
    checksum: checksum,
    stats: function () {
      return {
        frame: STATS.frame, faces: STATS.faces, tris: STATS.tris, objects: STATS.objs,
        ms: +STATS.ms.toFixed(2), res: W + "x" + H, meshes: WORLD.objects.length,
        waterVerts: WATER.vcount, waterQuads: WATER.qcount,
        palettes: PALS.length, maxVerts: MAXV,
        geoDropped: GEO_DROPPED, nanVerts: NAN_FLOATS
      };
    },
    seek: seekTo,
    play: function () { setPlaying(true); },
    pause: function () { setPlaying(false); },
    audio: function () { return { ready: AUD.ready, muted: AUD.muted, state: AUD.ctx ? AUD.ctx.state : "none" }; },
    selfTest: selfTest,
    bench: bench
  };
}
function boot() {
  buildCameraPath();
  buildWorld();
  buildPalettes();
  buildParticles();
  buildScore();
  initRenderer(document.getElementById("view"));
  initHUD();
  exposeAPI();
  var Q = new URLSearchParams(location.search);
  var fq = Q.get("frame");
  PLAY.playing = true;
  PLAY.baseT = 0;
  PLAY.base = performance.now();
  renderFrame(0);
  if (fq !== null) {
    FROZEN = true;
    PLAY.playing = false;
    var n = Math.max(0, Math.min(FRAMES - 1, parseInt(fq, 10) || 0));
    PLAY.baseT = n / CONFIG.FPS;
    renderFrame(n);
    updateHUD(evaluate(PLAY.baseT));
  }
  if (Q.get("selftest") === "1") setTimeout(selfTest, 80);
  if (Q.get("bench") === "1") setTimeout(bench, 80);
  requestAnimationFrame(tick);
}
boot();

</script>
